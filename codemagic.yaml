workflows:
  trademe_android:
    name: Trade Me v2 Android APK
    max_build_duration: 60
    instance_type: mac_mini_m2

    environment:
      java: 17

    scripts:

      - name: Create Android project
        script: |
          set -e

          mkdir -p app/src/main/java/com/trademe/app
          mkdir -p app/src/main/res/values

          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = 'TradeMeAndroid'
          include ':app'
          EOF

          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.5.2' apply false
          }
          EOF

          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          EOF

          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.trademe.app'
              compileSdk 35

              defaultConfig {
                  applicationId 'com.trademe.app'
                  minSdk 26
                  targetSdk 35
                  versionCode 1
                  versionName '2.1.0'
              }
          }
          EOF

          cat > app/src/main/res/values/strings.xml <<'EOF'
          <resources>
              <string name="app_name">Trade Me</string>
          </resources>
          EOF

          cat > app/src/main/res/values/styles.xml <<'EOF'
          <resources>
              <style name="AppTheme"
                  parent="android:style/Theme.Material.Light.NoActionBar">
                  <item name="android:fontFamily">sans</item>
                  <item name="android:windowActionModeOverlay">true</item>
                  <item name="android:colorAccent">#1565C0</item>
                  <item name="android:navigationBarColor">#000000</item>
                  <item name="android:statusBarColor">#111111</item>
                  <item name="android:windowLightStatusBar">false</item>
              </style>
          </resources>
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />

              <application
                  android:allowBackup="false"
                  android:label="Trade Me"
                  android:theme="@style/AppTheme"
                  android:usesCleartextTraffic="true">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true">

                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>

                  </activity>

              </application>

          </manifest>
          EOF

          cat > app/src/main/java/com/trademe/app/MainActivity.java <<'EOF'
          package com.trademe.app;

          import android.Manifest;
          import android.app.Activity;
          import android.content.Intent;
          import android.content.pm.PackageManager;
          import android.net.Uri;
          import android.os.Build;
          import android.os.Bundle;
          import android.view.View;
          import android.webkit.WebChromeClient;
          import android.webkit.WebResourceRequest;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;

          public class MainActivity extends Activity {

              private static final String APP_URL =
                      "http://4.195.67.207:8765/";

              private WebView webView;

              @Override
              public void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);

                  webView = new WebView(this);
                  setContentView(webView);

                  WebSettings settings = webView.getSettings();

                  settings.setJavaScriptEnabled(true);
                  settings.setDomStorageEnabled(true);
                  settings.setDatabaseEnabled(true);
                  settings.setLoadsImagesAutomatically(true);
                  settings.setSupportZoom(false);
                  settings.setBuiltInZoomControls(false);
                  settings.setDisplayZoomControls(false);
                  settings.setMediaPlaybackRequiresUserGesture(false);

                  webView.setWebChromeClient(new WebChromeClient());

                  webView.setWebViewClient(new WebViewClient() {

                      @Override
                      public boolean shouldOverrideUrlLoading(
                              WebView view,
                              WebResourceRequest request) {

                          Uri uri = request.getUrl();

                          if (uri.getScheme() != null
                                  && uri.getScheme().equals("http")
                                  && uri.getHost() != null
                                  && uri.getHost().equals("4.195.67.207")) {

                              return false;
                          }

                          try {
                              startActivity(
                                      new Intent(Intent.ACTION_VIEW, uri)
                              );
                          } catch (Exception ignored) {
                          }

                          return true;
                      }
                  });

                  webView.setOverScrollMode(
                          View.OVER_SCROLL_NEVER
                  );

                  webView.loadUrl(APP_URL);

                  if (Build.VERSION.SDK_INT >= 33
                          && checkSelfPermission(
                          Manifest.permission.POST_NOTIFICATIONS
                  ) != PackageManager.PERMISSION_GRANTED) {

                      requestPermissions(
                              new String[]{
                                      Manifest.permission.POST_NOTIFICATIONS
                              },
                              1001
                      );
                  }
              }

              @Override
              public void onBackPressed() {

                  if (webView.canGoBack()) {
                      webView.goBack();
                  } else {
                      super.onBackPressed();
                  }
              }
          }
          EOF

      - name: Create Gradle wrapper
        script: |
          set -e
          gradle --version
          gradle wrapper \
            --gradle-version 8.7 \
            --distribution-type bin

      - name: Build Trade Me APK
        script: |
          set -e
          chmod +x ./gradlew

          ./gradlew \
            assembleDebug \
            --no-daemon \
            --stacktrace

    artifacts:
      - app/build/outputs/apk/debug/*.apk
