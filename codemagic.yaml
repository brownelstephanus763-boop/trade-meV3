workflows:
  trademe_android_royal:
    name: Trade Me v2 — Royal AI Android
    max_build_duration: 60
    instance_type: mac_mini_m2

    environment:
      java: 17

    scripts:

      # ============================================================
      # CREATE TRADE ME ANDROID PROJECT
      # ============================================================

      - name: Create Trade Me Royal Android project
        script: |
          set -e

          echo "=============================================="
          echo "        TRADE ME v2 — ROYAL ANDROID"
          echo "=============================================="

          mkdir -p app/src/main/java/com/trademe/app
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/res/drawable

          # ========================================================
          # SETTINGS
          # ========================================================

          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)

              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "TradeMeAndroid"

          include(":app")
          EOF

          # ========================================================
          # ROOT BUILD
          # ========================================================

          cat > build.gradle <<'EOF'
          plugins {
              id "com.android.application" version "8.5.2" apply false
          }
          EOF

          # ========================================================
          # GRADLE PROPERTIES
          # ========================================================

          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          EOF

          # ========================================================
          # APP BUILD
          # ========================================================

          cat > app/build.gradle <<'EOF'
          plugins {
              id "com.android.application"
          }

          android {
              namespace "com.trademe.app"

              compileSdk 35

              defaultConfig {
                  applicationId "com.trademe.app"

                  minSdk 26
                  targetSdk 35

                  versionCode 3
                  versionName "2.2.0"
              }
          }
          EOF

          # ========================================================
          # APP NAME
          # ========================================================

          cat > app/src/main/res/values/strings.xml <<'EOF'
          <resources>
              <string name="app_name">Trade Me</string>
          </resources>
          EOF

          # ========================================================
          # ROYAL THEME
          # ========================================================

          cat > app/src/main/res/values/styles.xml <<'EOF'
          <resources>

              <style
                  name="AppTheme"
                  parent="android:style/Theme.Material.Light.NoActionBar">

                  <item name="android:fontFamily">sans</item>

                  <item name="android:windowActionModeOverlay">true</item>

                  <item name="android:colorAccent">#D4AF37</item>

                  <item name="android:windowLightStatusBar">false</item>

                  <item name="android:windowLightNavigationBar">false</item>

                  <item name="android:windowNoTitle">true</item>

                  <item name="android:windowDisablePreview">true</item>

                  <item name="android:windowBackground">#07080B</item>

              </style>

          </resources>
          EOF

          # ========================================================
          # ROYAL LAUNCHER ICON
          # ========================================================

          cat > app/src/main/res/drawable/trademe_icon.xml <<'EOF'
          <vector
              xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp"
              android:height="108dp"
              android:viewportWidth="108"
              android:viewportHeight="108">

              <!-- Luxury black background -->
              <path
                  android:fillColor="#07080B"
                  android:pathData="M0,0 L108,0 L108,108 L0,108 Z" />

              <!-- Crown -->
              <path
                  android:fillColor="#D4AF37"
                  android:pathData="
                  M18,50
                  L28,28
                  L42,40
                  L54,20
                  L66,40
                  L80,28
                  L90,50
                  L83,59
                  L25,59
                  Z" />

              <!-- Crown highlight -->
              <path
                  android:fillColor="#F1D675"
                  android:pathData="
                  M25,59
                  L83,59
                  L77,66
                  L31,66
                  Z" />

              <!-- T -->
              <path
                  android:fillColor="#D4AF37"
                  android:pathData="
                  M28,73
                  L47,73
                  L47,78
                  L41,78
                  L41,94
                  L35,94
                  L35,78
                  L28,78
                  Z" />

              <!-- M -->
              <path
                  android:fillColor="#D4AF37"
                  android:pathData="
                  M50,73
                  L57,73
                  L61,84
                  L65,73
                  L72,73
                  L72,94
                  L66,94
                  L66,81
                  L62,92
                  L59,92
                  L55,81
                  L55,94
                  L50,94
                  Z" />

          </vector>
          EOF

          # ========================================================
          # ANDROID MANIFEST
          # ========================================================

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <manifest
              xmlns:android="http://schemas.android.com/apk/res/android">

              <!-- Network access required for Trade Me v2 -->
              <uses-permission
                  android:name="android.permission.INTERNET" />

              <!-- Android 13+ notifications -->
              <uses-permission
                  android:name="android.permission.POST_NOTIFICATIONS" />

              <application
                  android:allowBackup="false"
                  android:label="Trade Me"
                  android:icon="@drawable/trademe_icon"
                  android:roundIcon="@drawable/trademe_icon"
                  android:theme="@style/AppTheme"
                  android:usesCleartextTraffic="true"
                  android:hardwareAccelerated="true">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:screenOrientation="portrait">

                      <intent-filter>

                          <action
                              android:name="android.intent.action.MAIN" />

                          <category
                              android:name="android.intent.category.LAUNCHER" />

                      </intent-filter>

                  </activity>

              </application>

          </manifest>
          EOF

          # ========================================================
          # MAIN ACTIVITY
          # ========================================================

          cat > app/src/main/java/com/trademe/app/MainActivity.java <<'EOF'
          package com.trademe.app;

          import android.Manifest;
          import android.app.Activity;
          import android.content.Intent;
          import android.content.pm.PackageManager;
          import android.graphics.Color;
          import android.net.Uri;
          import android.os.Build;
          import android.os.Bundle;
          import android.view.View;
          import android.view.WindowInsets;
          import android.webkit.CookieManager;
          import android.webkit.SafeBrowsingResponse;
          import android.webkit.WebChromeClient;
          import android.webkit.WebResourceRequest;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import android.widget.FrameLayout;

          public class MainActivity extends Activity {

              /*
               * EXISTING LIVE TRADE ME v2 SERVER.
               *
               * The Android application is only the client.
               * The existing analysis engine remains on the server.
               *
               * Execution remains disabled.
               */
              private static final String APP_URL =
                      "http://4.195.67.207:8765/";

              private static final String TRADE_ME_HOST =
                      "4.195.67.207";

              private WebView webView;

              private FrameLayout root;

              @Override
              public void onCreate(Bundle savedInstanceState) {

                  super.onCreate(savedInstanceState);

                  /*
                   * =================================================
                   * ROOT CONTAINER
                   * =================================================
                   *
                   * Android 15+ enforces edge-to-edge for apps
                   * targeting SDK 35.
                   *
                   * We therefore handle the system-bar insets
                   * ourselves instead of allowing the WebView to
                   * disappear underneath them.
                   */

                  root = new FrameLayout(this);

                  root.setBackgroundColor(
                          Color.rgb(7, 8, 11)
                  );

                  webView = new WebView(this);

                  webView.setBackgroundColor(
                          Color.rgb(7, 8, 11)
                  );

                  FrameLayout.LayoutParams params =
                          new FrameLayout.LayoutParams(
                                  FrameLayout.LayoutParams.MATCH_PARENT,
                                  FrameLayout.LayoutParams.MATCH_PARENT
                          );

                  root.addView(webView, params);

                  /*
                   * =================================================
                   * SAFE AREA / WINDOW INSETS
                   * =================================================
                   */

                  root.setOnApplyWindowInsetsListener(
                          (view, insets) -> {

                              if (Build.VERSION.SDK_INT >= 30) {

                                  android.graphics.Insets bars =
                                          insets.getInsets(
                                                  WindowInsets.Type.systemBars()
                                                          | WindowInsets.Type.displayCutout()
                                          );

                                  /*
                                   * Push Trade Me below the status
                                   * bar and above the navigation area.
                                   */
                                  view.setPadding(
                                          bars.left,
                                          bars.top,
                                          bars.right,
                                          bars.bottom
                                  );

                                  /*
                                   * The parent handled the system
                                   * bars, so prevent the WebView from
                                   * applying the same inset again.
                                   */
                                  return new WindowInsets.Builder(
                                          insets
                                  ).setInsets(
                                          WindowInsets.Type.systemBars()
                                                  | WindowInsets.Type.displayCutout(),
                                          android.graphics.Insets.NONE
                                  ).build();

                              } else {

                                  /*
                                   * Legacy Android handling.
                                   */
                                  int left =
                                          insets.getSystemWindowInsetLeft();

                                  int top =
                                          insets.getSystemWindowInsetTop();

                                  int right =
                                          insets.getSystemWindowInsetRight();

                                  int bottom =
                                          insets.getSystemWindowInsetBottom();

                                  view.setPadding(
                                          left,
                                          top,
                                          right,
                                          bottom
                                  );

                                  return insets.consumeSystemWindowInsets();
                              }
                          }
                  );

                  setContentView(root);

                  /*
                   * =================================================
                   * WEBVIEW SETTINGS
                   * =================================================
                   */

                  WebSettings settings =
                          webView.getSettings();

                  settings.setJavaScriptEnabled(true);

                  settings.setDomStorageEnabled(true);

                  settings.setDatabaseEnabled(true);

                  settings.setLoadsImagesAutomatically(true);

                  settings.setMediaPlaybackRequiresUserGesture(
                          false
                  );

                  /*
                   * =================================================
                   * ZOOM PROTECTION
                   * =================================================
                   *
                   * Prevent the dashboard from appearing enlarged.
                   */

                  settings.setSupportZoom(false);

                  settings.setBuiltInZoomControls(false);

                  settings.setDisplayZoomControls(false);

                  settings.setTextZoom(100);

                  settings.setDefaultFontSize(16);

                  settings.setDefaultFixedFontSize(13);

                  settings.setUseWideViewPort(true);

                  settings.setLoadWithOverviewMode(true);

                  /*
                   * =================================================
                   * WEBVIEW SECURITY HARDENING
                   * =================================================
                   */

                  /*
                   * Trade Me does not need local file access.
                   */
                  settings.setAllowFileAccess(false);

                  /*
                   * Trade Me does not need arbitrary content-provider
                   * access.
                   */
                  settings.setAllowContentAccess(false);

                  /*
                   * Do not allow a local file to reach arbitrary
                   * network resources.
                   */
                  settings.setAllowFileAccessFromFileURLs(false);

                  settings.setAllowUniversalAccessFromFileURLs(false);

                  /*
                   * Android Safe Browsing.
                   */
                  if (Build.VERSION.SDK_INT >= 26) {

                      settings.setSafeBrowsingEnabled(true);
                  }

                  /*
                   * Prevent third-party cookies.
                   *
                   * The Trade Me application does not require them.
                   */
                  CookieManager cookies =
                          CookieManager.getInstance();

                  cookies.setAcceptCookie(true);

                  cookies.setAcceptThirdPartyCookies(
                          webView,
                          false
                  );

                  /*
                   * Do not allow mixed HTTP/HTTPS content.
                   *
                   * The current Trade Me server itself is HTTP,
                   * so this setting does not interfere with the
                   * main page. It prevents the page from loading
                   * arbitrary mixed-content resources.
                   */
                  settings.setMixedContentMode(
                          WebSettings.MIXED_CONTENT_NEVER_ALLOW
                  );

                  /*
                   * =================================================
                   * SCROLLING
                   * =================================================
                   */

                  webView.setOverScrollMode(
                          View.OVER_SCROLL_NEVER
                  );

                  webView.setVerticalScrollBarEnabled(false);

                  webView.setHorizontalScrollBarEnabled(false);

                  /*
                   * =================================================
                   * CHROME
                   * =================================================
                   */

                  webView.setWebChromeClient(
                          new WebChromeClient()
                  );

                  /*
                   * =================================================
                   * NAVIGATION SECURITY
                   * =================================================
                   */

                  webView.setWebViewClient(
                          new WebViewClient() {

                              @Override
                              public boolean shouldOverrideUrlLoading(
                                      WebView view,
                                      WebResourceRequest request) {

                                  Uri uri =
                                          request.getUrl();

                                  String scheme =
                                          uri.getScheme();

                                  String host =
                                          uri.getHost();

                                  /*
                                   * Keep ONLY the existing Trade Me
                                   * server inside the application.
                                   */
                                  if (
                                      scheme != null
                                      && scheme.equalsIgnoreCase("http")
                                      && host != null
                                      && host.equals(TRADE_ME_HOST)
                                  ) {

                                      return false;
                                  }

                                  /*
                                   * Everything else opens externally.
                                   */
                                  try {

                                      Intent external =
                                              new Intent(
                                                      Intent.ACTION_VIEW,
                                                      uri
                                              );

                                      startActivity(external);

                                  } catch (Exception ignored) {
                                  }

                                  return true;
                              }

                              /*
                               * Safe Browsing handling.
                               */
                              @Override
                              public void onSafeBrowsingHit(
                                      WebView view,
                                      WebResourceRequest request,
                                      int threatType,
                                      SafeBrowsingResponse callback) {

                                  if (Build.VERSION.SDK_INT >= 27) {

                                      callback.backToSafety(
                                              true
                                      );

                                  } else {

                                      super.onSafeBrowsingHit(
                                              view,
                                              request,
                                              threatType,
                                              callback
                                      );
                                  }
                              }
                          }
                  );

                  /*
                   * =================================================
                   * LOAD EXISTING TRADE ME v2
                   * =================================================
                   */

                  webView.loadUrl(APP_URL);

                  /*
                   * =================================================
                   * NOTIFICATION PERMISSION
                   * =================================================
                   */

                  if (
                      Build.VERSION.SDK_INT >= 33
                      && checkSelfPermission(
                              Manifest.permission.POST_NOTIFICATIONS
                      ) != PackageManager.PERMISSION_GRANTED
                  ) {

                      requestPermissions(
                              new String[] {
                                      Manifest.permission.POST_NOTIFICATIONS
                              },
                              1001
                      );
                  }
              }

              /*
               * =====================================================
               * BACK BUTTON
               * =====================================================
               */

              @Override
              public void onBackPressed() {

                  if (
                      webView != null
                      && webView.canGoBack()
                  ) {

                      webView.goBack();

                  } else {

                      super.onBackPressed();
                  }
              }
          }
          EOF

          echo ""
          echo "=============================================="
          echo " Royal Android project created successfully."
          echo " Edge-to-edge protection: ENABLED"
          echo " Zoom protection: ENABLED"
          echo " WebView hardening: ENABLED"
          echo " Royal launcher icon: ENABLED"
          echo "=============================================="

      # ============================================================
      # CREATE GRADLE WRAPPER
      # ============================================================

      - name: Create Gradle wrapper
        script: |
          set -e

          echo "Checking Gradle installation..."

          gradle --version

          echo "Creating Gradle 8.7 wrapper..."

          gradle wrapper \
            --gradle-version 8.7 \
            --distribution-type bin

      # ============================================================
      # BUILD APK
      # ============================================================

      - name: Build Trade Me Royal APK
        script: |
          set -e

          echo "=============================================="
          echo " Building Trade Me v2 Royal APK"
          echo "=============================================="

          chmod +x ./gradlew

          ./gradlew \
            assembleDebug \
            --no-daemon \
            --stacktrace

          echo ""
          echo "=============================================="
          echo " APK BUILD COMPLETE"
          echo "=============================================="

          ls -lh app/build/outputs/apk/debug/

      # ============================================================
      # FINAL VALIDATION
      # ============================================================

      - name: Validate APK output
        script: |
          set -e

          APK_COUNT=$(find app/build/outputs/apk/debug \
            -maxdepth 1 \
            -name "*.apk" \
            | wc -l)

          if [ "$APK_COUNT" -lt 1 ]; then
              echo "ERROR: APK was not generated."
              exit 1
          fi

          echo "APK validation passed."
          find app/build/outputs/apk/debug \
            -maxdepth 1 \
            -name "*.apk" \
            -print

    # ==============================================================
    # CODemagic ARTIFACT
    # ==============================================================

    artifacts:
      - app/build/outputs/apk/debug/*.apk
